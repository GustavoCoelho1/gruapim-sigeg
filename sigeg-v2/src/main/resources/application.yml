spring:
  application:
    name: sigeg-api

  # ===== DATASOURCE =====
  datasource:
    url: jdbc:postgresql://localhost:5432/sigeg_db
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  # ===== JPA / HIBERNATE =====
  jpa:
    hibernate:
      ddl-auto: validate          # Flyway gerencia o schema
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 20

  # ===== FLYWAY =====
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ===== JACKSON =====
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

# ===== SERVER =====
server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

# ===== JWT (RNF 2 – Segurança) =====
jwt:
  secret: ${JWT_SECRET:sigeg-chave-secreta-alterar-em-producao-minimo-256bits}
  expiration: 86400000        # 24h em ms
  refresh-expiration: 604800000 # 7 dias em ms

# ===== SPRINGDOC =====
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha

# ===== LOGGING =====
logging:
  level:
    root: INFO
    com.sigeg: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
