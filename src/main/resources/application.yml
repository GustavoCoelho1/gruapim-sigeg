spring:
  application:
    name: sigeg-api
  datasource:
    url: jdbc:postgresql://localhost:5432/sigeg_db
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
  jpa:
    hibernate:
      ddl-auto: validate # Usaremos Flyway para gerenciar o esquema
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080
  error:
    include-message: always
